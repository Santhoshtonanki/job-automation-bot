name: Daily Job Alerts on: schedule: - cron: '30 2 * * *' # 8:00 AM IST workflow_dispatch: jobs: send-jobs: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: '3.11' - run: pip install requests - run: python send_jobs.py env: TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
